<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模板功能验收</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#f2f1ed;color:#222;font:15px/1.6 system-ui}main{max-width:1500px;margin:auto}h1{font-size:25px;margin:0 0 6px}header{margin-bottom:20px}a{color:#2113ff}select{font:inherit;padding:7px;border:1px solid #aaa;background:white}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}figure{margin:0}img{width:100%;height:auto;display:block;box-shadow:0 4px 12px #0002}figcaption{margin:6px 0 12px}small{color:#666}.detail{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:1050px;margin:28px auto}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.detail{grid-template-columns:1fr}}@media(max-width:420px){.grid{grid-template-columns:1fr}body{padding:16px}}</style><main><header><h1>模板功能验收 · 8组</h1><div><a href="../../../../index.html#poster">打开编辑器</a> · <a href="results.md">本轮验收记录</a></div><p>用03／20两张照片检查模板适配。示范选图与验收照片分开；上传素材贯穿八组REMIX。</p><label>查看场景 <select id="scene"><option value="single-aespa-03">03 · 单图</option><option value="single-aespa-20">20 · 单图</option><option value="pair-main-03">03＋20 · 主图03</option><option value="pair-main-20">03＋20 · 主图20</option></select></label></header><div class="grid" id="grid"></div><h2>功能修正示例 · 模板8</h2><p>相框铺满裁切与完整人物可切换；字体菜单与模板实际字体一致，面板支持多行文字。</p><div class="detail"><figure><img src="fit-cover.png" alt="铺满相框的人物取景"><figcaption>填满画框 · 保留特写取景</figcaption></figure><figure><img src="pair-main-20-template-08.png" alt="完整人物取景"><figcaption>完整照片／人物 · 保留原图范围</figcaption></figure></div><h2>竖图取景 · 默认与手调</h2><div class="detail"><figure><img src="single-aespa-20-template-07.png" alt="模板7竖图默认取景"><figcaption>20 · 默认横框取景</figcaption></figure><figure><img src="template-07-portrait-crop-adjusted.png" alt="模板7上移人物取景"><figcaption>首张辅图 · 垂直取景偏移200</figcaption></figure></div><p><small>参考中的全身姿态受原照片内容限制，完整取景不会补画原图外的人体。旧草稿保留原设置，可在辅图「窗口与取景」中切换照片适配。</small></p></main><script>const names=['Aespa 电光档案','AFTER IMAGE','Blue Valentine','Pink Desktop','Photo Booth','AirDrop Diary','After Hours Album','Electric Blue Archive'];const scene=document.querySelector('#scene'),grid=document.querySelector('#grid');function show(){grid.innerHTML=names.map((name,i)=>{const n=String(i+1).padStart(2,'0'),file=scene.value+'-template-'+n+'.png';return '<figure><a href="'+file+'"><img src="'+file+'" alt="模板'+n+' '+name+'"></a><figcaption>'+n+' · '+name+'</figcaption></figure>'}).join('')}scene.addEventListener('change',show);show();</script></html>
